name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Verify repo
        run: ./scripts/verify_repo.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build example frontend
        run: npm run build

  integration-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: ./scripts/install-ci-osv-scanner.sh
      - run: ./scripts/start-ci-postgres.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Verify Postgres ingest/export flow
        run: ./scripts/verify_ingest_export.sh postgres

      - name: Package SQLite release artifact
        run: ./scripts/release_sqlite_artifact.sh postgres

      - name: Upload SQLite artifact smoke bundle
        uses: actions/upload-artifact@v7
        with:
          name: sqlite-artifact-postgres-smoke
          path: artifacts/sqlite/
          if-no-files-found: error

  integration-mysql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: ./scripts/install-ci-trivy.sh
      - run: ./scripts/start-ci-mysql.sh
        timeout-minutes: 15

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Verify MySQL ingest/export flow
        run: ./scripts/verify_ingest_export.sh mysql
