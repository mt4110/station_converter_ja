version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /
      - /worker/api
      - /worker/crawler
      - /worker/ops
      - /deploy/docker/adminer
      - /deploy/docker/postgres-ci
      - /deploy/docker/redis
    schedule:
      interval: daily
      time: "09:45"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
